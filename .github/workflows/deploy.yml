name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SYS_PROMPT: ${{ secrets.SYS_PROMPT }}
          TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          envs: DEEPSEEK_API_KEY,GEMINI_API_KEY,TELEGRAM_BOT_TOKEN,POSTGRES_PASSWORD,SYS_PROMPT,TELEGRAM_ALLOWED_CHATS,TELEGRAM_CHAT_ID,LANGFUSE_HOST,LANGFUSE_PUBLIC_KEY,LANGFUSE_SECRET_KEY
          script: |
            set -e

            # Генерируем .env из GitHub Secrets
            # SYS_PROMPT может содержать переносы строк — схлопываем в одну строку
            SAFE_PROMPT=$(printf '%s' "$SYS_PROMPT" | tr '\n' ' ')
            {
              echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY"
              echo "GEMINI_API_KEY=$GEMINI_API_KEY"
              echo "SYS_PROMPT=$SAFE_PROMPT"
              echo ""
              echo "LLM_PROVIDER=openai"
              echo "LLM_BASE_URL=https://api.deepseek.com/v1"
              echo "LLM_CHAT_MODEL=deepseek-v4-flash"
              echo "LLM_TIMEOUT_SECONDS=30"
              echo "LLM_RETRY_COUNT=2"
              echo "LLM_RETRY_BASE_MS=500"
              echo "LLM_FALLBACK_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/"
              echo "LLM_FALLBACK_MODEL=gemini-2.0-flash"
              echo ""
              echo "EMBEDDING_MODEL=text-embedding-004"
              echo ""
              echo "POSTGRES_DB=simpleai"
              echo "POSTGRES_USER=simpleai"
              echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
              echo "POSTGRES_PORT=5432"
              echo "POSTGRES_HOST=localhost"
              echo ""
              echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
              echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
              echo "TELEGRAM_ALLOWED_CHATS=$TELEGRAM_ALLOWED_CHATS"
              echo "TELEGRAM_WORKERS=4"
              echo "TELEGRAM_RATE_LIMIT_MS=0"
              echo "TELEGRAM_MEDIA_DIR=data/telegram"
              echo ""
              echo "MAIL_ACCOUNTS_JSON=[]"
              echo ""
              echo "LOG_LEVEL=info"
              echo "LOG_FORMAT=json"
              echo ""
              echo "LANGFUSE_HOST=$LANGFUSE_HOST"
              echo "LANGFUSE_PUBLIC_KEY=$LANGFUSE_PUBLIC_KEY"
              echo "LANGFUSE_SECRET_KEY=$LANGFUSE_SECRET_KEY"
            } > ~/simpleAI/.env

            cd ~/simpleAI
            git pull origin main
            docker compose up -d
            sleep 3

            # Сбрасываем схему если миграции не были применены успешно
            docker exec simpleai-postgres psql -U simpleai -d simpleai -c "
              DO \$\$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1 FROM goose_db_version
                  WHERE version_id = 1 AND is_applied = true
                ) THEN
                  DROP SCHEMA public CASCADE;
                  CREATE SCHEMA public;
                  GRANT ALL ON SCHEMA public TO simpleai;
                END IF;
              EXCEPTION WHEN undefined_table THEN
                DROP SCHEMA public CASCADE;
                CREATE SCHEMA public;
                GRANT ALL ON SCHEMA public TO simpleai;
              END
              \$\$;"
            # Явно применяем pending миграции схемы (страховка если goose в бинаре не успел)
            docker exec simpleai-postgres psql -U simpleai -d simpleai -c "
              ALTER TABLE budget_transaction ADD COLUMN IF NOT EXISTS currency TEXT NOT NULL DEFAULT 'RUB';"
            docker exec simpleai-postgres psql -U simpleai -d simpleai -c "
              CREATE TABLE IF NOT EXISTS budget_reminder (
                chat_id       BIGINT PRIMARY KEY,
                enabled       BOOLEAN NOT NULL DEFAULT true,
                notify_hour   INT NOT NULL DEFAULT 21,
                notify_minute INT NOT NULL DEFAULT 0,
                timezone      TEXT NOT NULL DEFAULT 'UTC',
                updated_at    TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now()
              );"

            # Форсируем пересборку (go build берёт кеш если Go-файлы не менялись,
            # но embedded SQL файлы при этом могут быть устаревшими)
            /usr/local/go/bin/go clean -cache
            CGO_ENABLED=0 /usr/local/go/bin/go build -o bin/app ./cmd/app
            sudo systemctl restart simpleai
            systemctl is-active --quiet simpleai && echo "✓ simpleai is running"
