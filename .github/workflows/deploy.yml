name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -e
            cd ~/simpleAI
            git pull origin main
            CGO_ENABLED=0 /usr/local/go/bin/go build -o bin/app ./cmd/app
            sudo systemctl restart simpleai
            systemctl is-active --quiet simpleai && echo "✓ simpleai is running"
