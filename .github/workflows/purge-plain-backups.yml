name: Purge unencrypted backups

# Разовый: удаляет релизы backup-* с незашифрованным дампом (*.dump.gz) —
# репозиторий публичный, они были доступны всем. Зашифрованные (*.enc) не трогает.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete plain backup releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName | select(startswith("backup-"))'); do
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if printf '%s\n' "$assets" | grep -q '\.enc$'; then
              echo "keep  $tag (encrypted)"
              continue
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "deleted $tag"
            deleted=$((deleted + 1))
          done
          echo "Deleted: $deleted"
