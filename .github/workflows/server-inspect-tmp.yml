name: Server inspect (temporary, encrypted)

# Временный: только просмотр процессов на сервере — запущен ли mailguard. Репозиторий публичный,
# поэтому результат шифруется переданным открытым ключом: в логах только шифр. Удаляется после использования.
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: base64 PEM открытого RSA-ключа
        required: true

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Read and encrypt
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" 'set +e
            echo "== docker"; docker ps -a --format "{{.Names}} | {{.Image}} | {{.Status}}"
            echo "== systemd"; systemctl list-units --all --no-pager --plain 2>/dev/null | grep -iE "mail|guard|imap"
            echo "== user systemd"; systemctl --user list-units --all --no-pager --plain 2>/dev/null | grep -iE "mail|guard"
            echo "== processes"; ps -eo pid,user,etime,cmd | grep -iE "mailguard|imap" | grep -v grep
            echo "== crontab"; crontab -l 2>/dev/null | grep -iE "mail|guard"
            echo "== k8s"; command -v kubectl k3s microk8s 2>/dev/null; kubectl get deploy -A 2>/dev/null | grep -i mail
            echo "== dirs"; ls -d ~/mailguard* /opt/mailguard* /srv/mailguard* 2>/dev/null; true' > out.txt
          printf '%s' "$PUBKEY" | base64 -d > pub.pem
          openssl rand -hex 32 > k
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:k -in out.txt -out out.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k -out k.enc
          echo "KEY_B64=$(base64 -w0 k.enc)"
          echo "DATA_B64=$(base64 -w0 out.enc)"
          rm -f out.txt k
