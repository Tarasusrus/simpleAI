version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: simpleai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simpleai}
      POSTGRES_USER: ${POSTGRES_USER:-simpleai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simpleai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
