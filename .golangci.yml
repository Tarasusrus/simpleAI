version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Базовые
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Безопасность
    - gosec
    # Корректность
    - bodyclose
    - nilerr
    - nilnil
    - reassign
    - unconvert
    - unparam
    - exhaustive
    # Стиль
    - misspell
    - revive
    - whitespace
    - predeclared
    - usestdlibvars
    # Перформанс
    - prealloc

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      excludes:
        - G104  # unhandled defer errors — покрыто errcheck
        - G118  # goroutine context — намеренное использование background ctx
        - G301  # directory perms 0755 — приемлемо для этого CLI
        - G304  # file inclusion via variable — контролируемые пути
        - G306  # file write perms 0644 — приемлемо для data files
        - G703  # path traversal — PROMPTS_DIR env var контролируется оператором
    revive:
      rules:
        # exported отключено — внутренние пакеты проекта не требуют godoc
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam       # value semantics для domain DTO — architectural decision
        - rangeValCopy    # pre-existing, не bottleneck
        - paramTypeCombine  # нарушает читаемость типов в сигнатурах
        - commentedOutCode  # inline calculation notes в тестах
        - unnamedResult     # стиль проекта не требует именованных возвратов

  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gosec
          - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
